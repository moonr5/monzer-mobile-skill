<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d">
  <title id="t">One system, one data set</title>
  <desc id="d">Web app and mobile app share the same accounts, API, and database.</desc>
  <rect width="960" height="320" fill="#121418"/>
  <text x="480" y="36" fill="#F4EDE0" font-family="Georgia, serif" font-size="20" text-anchor="middle">ONE SYSTEM · ONE DATA</text>
  <rect x="48" y="72" width="240" height="180" rx="16" fill="#1C2026" stroke="#C6A15B"/>
  <text x="168" y="108" fill="#C6A15B" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">WEB APP</text>
  <text x="168" y="148" fill="#F4EDE0" font-family="ui-sans-serif, system-ui" font-size="16" text-anchor="middle">CRM / dealer platform</text>
  <text x="168" y="176" fill="#B8B2A6" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">Same login</text>
  <text x="168" y="198" fill="#B8B2A6" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">Same permissions</text>
  <rect x="360" y="72" width="240" height="180" rx="16" fill="#1F4E5A"/>
  <text x="480" y="108" fill="#F4EDE0" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">EXISTING BACKEND</text>
  <text x="480" y="152" fill="#F4EDE0" font-family="Georgia, serif" font-size="18" text-anchor="middle">API + database</text>
  <text x="480" y="184" fill="#D8E6E4" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">No second database</text>
  <text x="480" y="206" fill="#D8E6E4" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">No secrets in the app</text>
  <rect x="672" y="72" width="240" height="180" rx="16" fill="#1C2026" stroke="#C6A15B"/>
  <text x="792" y="108" fill="#C6A15B" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">MOBILE APP</text>
  <text x="792" y="148" fill="#F4EDE0" font-family="ui-sans-serif, system-ui" font-size="16" text-anchor="middle">iOS + Android client</text>
  <text x="792" y="176" fill="#B8B2A6" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">React Native + Expo</text>
  <text x="792" y="198" fill="#B8B2A6" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">Same data in seconds</text>
  <line x1="288" y1="162" x2="360" y2="162" stroke="#C6A15B" stroke-width="2"/>
  <line x1="600" y1="162" x2="672" y2="162" stroke="#C6A15B" stroke-width="2"/>
  <text x="480" y="292" fill="#8C877C" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle">Mobile is a client of the existing system, not a second product</text>
</svg>
